<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVIKA Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0c14;color:#f6f4ff;font:15px system-ui}header{padding:22px 5%;border-bottom:1px solid #30283f;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0;color:#f59ac9}main{max-width:1100px;margin:32px auto;padding:0 18px}.panel,.metric{background:#171825;border:1px solid #303044;border-radius:18px;padding:22px}#login{max-width:420px;margin:60px auto}input,button{font:inherit;padding:13px;border-radius:10px;border:1px solid #39374b}input{background:#0d0e17;color:white;width:100%;margin:8px 0}button{background:#a33c9b;color:white;cursor:pointer}button:disabled{opacity:.5}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0}.metric strong{display:block;font-size:36px;margin-top:10px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:13px;border-bottom:1px solid #303044;white-space:nowrap}th,small{color:#aaa5bf}[hidden]{display:none!important}#status{color:#f4a5c9;white-space:pre-wrap}</style></head><body><header><h1>AVIKA / CONTROL CENTER</h1><button id="logout" hidden>Sign out</button></header><main><p id="status" role="status"></p><form id="login" class="panel"><h2>Administrator login</h2><input id="email" type="email" placeholder="Email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button id="submit">Sign in securely</button></form><section id="dashboard" hidden><small>AUTHORIZED ADMIN • READ ONLY</small><h2>Platform overview</h2><button id="refresh">Refresh data</button><div class="metrics"><div class="metric">Registered users<strong id="users">—</strong></div><div class="metric">Posts<strong id="posts">—</strong></div><div class="metric">Stories stored<strong id="stories">—</strong></div></div><div class="panel"><h2>Recent registered users</h2><input id="search" placeholder="Search loaded users"><div class="scroll"><table><thead><tr><th>Email</th><th>Registered</th><th>Last sign-in</th></tr></thead><tbody id="rows"></tbody></table></div><small>Latest 100 registrations. Last sign-in is not live activity.</small></div></section></main><script>
const db=supabase.createClient('https://csarrgheuzybigifblny.supabase.co','sb_publishable_KAryjB40BugD0vSss4sj6Q_ohRhWvr8',{auth:{storageKey:'avika-admin-session'}});const $=id=>document.getElementById(id);let records=[];function clear(){records=[];$('rows').replaceChildren();$('dashboard').hidden=true;$('logout').hidden=true;$('login').hidden=false;for(const k of ['users','posts','stories'])$(k).textContent='—'}function render(){const q=$('search').value.toLowerCase();$('rows').replaceChildren();for(const u of records.filter(u=>(u.email||'').toLowerCase().includes(q))){const tr=document.createElement('tr');for(const v of [u.email,u.created_at?new Date(u.created_at).toLocaleString():'—',u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString():'—']){const td=document.createElement('td');td.textContent=v||'—';tr.append(td)}$('rows').append(tr)}}async function load(){clear();$('status').textContent='Checking authorization…';try{const {data,error}=await db.rpc('avika_admin_dashboard');if(error)throw error;for(const k of ['users','posts','stories'])$(k).textContent=data[k];records=data.recent||[];render();$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('status').textContent=''}catch(e){$('status').textContent=e.message||'Access denied';await db.auth.signOut()}}$('login').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error)throw error;await load()}catch(e){clear();$('status').textContent=e.message}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{clear();await db.auth.signOut();$('status').textContent='Signed out'};$('refresh').onclick=load;$('search').oninput=render;db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')clear()});db.auth.getSession().then(({data})=>{if(data.session)load()});</script></body></html>
